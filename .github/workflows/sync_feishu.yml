name: 同步飞书宴席数据
on:
  workflow_dispatch: # 保留手动按钮触发
  schedule:
  - cron: '0 * * * *'
    timezone: "Asia/Shanghai" # 北京时间每小时整点

jobs:
  sync_job:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 配置python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install requests openpyxl

      - name: 执行飞书多维表导出脚本
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_TOKEN: ${{ secrets.FEISHU_BITABLE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          python ./feishu_sync.py

      - name: 提交更新数据回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feishu_data.json star.xlsx
          git commit -m "auto sync feishu data" || echo "no changes to commit"
          git push origin main
