<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宴席农历日历</title>
  <!-- 引入SheetJS解析Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#222;
      --text2:#666;
      --text3:#999;
      --primary:#1677ff;
      --today:#1677ff;
      --select:#cce0ff;
      --border:#e5e7eb;
      --event:#fff0b3;
      /* 星日期颜色 */
      --star-wang:#ffcccc;/*星旺日红*/
      --star-ji:#ffe2bc;/*星吉日橙*/
      --star-hao:#e8d8f8;/*星好日紫*/
      --star-yi:#cdf2d8;/*星宜日绿*/
    }
    [data-theme="dark"]{
      --bg:#121212;
      --card:#1e1e1e;
      --text:#eee;
      --text2:#bbb;
      --text3:#888;
      --primary:#4096ff;
      --today:#1771d8;
      --select:#253b58;
      --border:#333;
      --event:#5c4a20;
      --star-wang:#782424;
      --star-ji:#804e22;
      --star-hao:#543874;
      --star-yi:#23633b;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
    body{background:var(--bg);color:var(--text);padding:16px;transition:0.3s}
    .wrap{max-width:1000px;margin:0 auto}
    .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .theme-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .btn{border:1px solid var(--border);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:8px;font-size:18px;cursor:pointer}
    .title{font-size:20px;font-weight:600}
    .week-row{display:flex}
    .week-item{flex:1;text-align:center;padding:10px 0;font-size:14px;color:var(--text2)}
    .day-grid{display:flex;flex-wrap:wrap}
    .day-item{width:14.2857%;text-align:center;padding:8px 2px;min-height:72px;border-radius:10px;cursor:pointer;border:1px solid transparent}
    .day-item.empty{cursor:default}
    .day-item.today{background:var(--today);color:#fff}
    .day-item.active{background:var(--select)}
    .day-item.has-ev{background:var(--event)}
    /* 星日期样式，优先级低于today */
    .day-item.star-wang{background:var(--star-wang)}
    .day-item.star-ji{background:var(--star-ji)}
    .day-item.star-hao{background:var(--star-hao)}
    .day-item.star-yi{background:var(--star-yi)}

    .solar{font-size:16px}
    .lunar{font-size:11px;color:var(--text3);margin-top:2px}
    .festival{font-size:10px;color:#f5222d}
    .solar-term{font-size:10px;color:#009688}
    .ev-tag{font-size:9px;color:#d4380d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .star-tag{font-size:9px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .info-card{background:var(--card);border-radius:12px;padding:16px;margin:16px 0;border:1px solid var(--border)}
    .query-box{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);margin-top:10px}
    .query-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
    select,input{padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)}
    .qbtn{padding:8px 14px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer}
    .result{margin-top:10px;padding:10px;border-radius:8px;background:var(--bg)}
    .refresh-btn{margin-bottom:10px;padding:6px 12px;background:#009688;color:#fff;border:none;border-radius:6px;cursor:pointer}
    .star-status{font-size:12px;color:var(--text3);margin-left:8px;}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h2>宴席农历节气日历</h2>
    <button class="theme-btn" id="themeBtn">切换深色</button>
  </div>
  <div>
    <button class="refresh-btn" id="refresh">刷新宴席数据</button>
    <span class="star-status" id="starStatus">星日期加载中...</span>
  </div>
  <div class="header">
    <button class="btn" id="prev">◀</button>
    <div class="title" id="ym"></div>
    <button class="btn" id="next">▶</button>
  </div>
  <div class="week-row">
    <div class="week-item">日</div><div class="week-item">一</div><div class="week-item">二</div><div class="week-item">三</div>
    <div class="week-item">四</div><div class="week-item">五</div><div class="week-item">六</div>
  </div>
  <div class="day-grid" id="calendar"></div>
  <div class="info-card" id="infoCard" style="display:none"><div id="infoText"></div></div>
  <div class="query-box">
    <h4>公历 ↔ 农历互查</h4>
    <div class="query-row">
      <select id="qType">
        <option value="s2l">公历查农历</option><option value="l2s">农历查公历</option>
      </select>
      <input type="number" id="qY" placeholder="年" value="2026">
      <input type="number" id="qM" placeholder="月" value="8">
      <input type="number" id="qD" placeholder="日" value="9">
      <button class="qbtn" id="doQuery">查询</button>
    </div>
    <div class="result" id="queryResult"></div>
  </div>
</div>
<script>
// ============================================================
// 【星日期Excel配置】修改这里切换数据源
// ============================================================
const STAR_EXCEL_CONFIG = {
  // 方式1：本地同目录文件（默认，把star.xlsx放到和index.html同一个文件夹）
  url: "./star.xlsx",
  // 方式2：在线Excel链接，替换上面的url，例如：
  // url: "https://raw.githubusercontent.com/xujunwei03/jdytbsj/main/star.xlsx",
  sheetName: "",  // 工作表名，留空自动取第一个sheet
  dateColumn: 0,  // 日期在第几列（0=A列，1=B列，以此类推）
  starColumn: 1,  // 星日期在第几列（0=A列，1=B列）
  skipHeader: true // 是否跳过第一行表头
};

let starDateMap = {}; // 星日期数据，从Excel加载

// ========== 加载星日期Excel ==========
async function loadStarExcel() {
  const statusEl = document.getElementById("starStatus");
  try {
    // 1. 下载Excel文件
    const resp = await fetch(STAR_EXCEL_CONFIG.url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const buf = await resp.arrayBuffer();

    // 2. 解析Excel
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheetName = STAR_EXCEL_CONFIG.sheetName || wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    if (!sheet) throw new Error("找不到工作表：" + sheetName);

    // 3. 转成二维数组
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });

    // 4. 组装成 { "yyyy-MM-dd": "星旺日" } 格式
    const map = {};
    const startIdx = STAR_EXCEL_CONFIG.skipHeader ? 1 : 0;
    for (let i = startIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.length === 0) continue;
      let dateVal = row[STAR_EXCEL_CONFIG.dateColumn];
      const starVal = (row[STAR_EXCEL_CONFIG.starColumn] || "").toString().trim();
      if (!dateVal || !starVal) continue;

      // 统一日期格式为 yyyy-MM-dd
      let dateStr;
      if (dateVal instanceof Date) {
        dateStr = dateVal.getFullYear() + "-"
          + String(dateVal.getMonth() + 1).padStart(2, "0") + "-"
          + String(dateVal.getDate()).padStart(2, "0");
      } else {
        dateVal = dateVal.toString().trim();
        // 支持 2027/1/1 和 2027-01-01 两种格式
        const parts = dateVal.split(/[\/\-]/);
        if (parts.length === 3) {
          dateStr = parts[0] + "-" + parts[1].padStart(2, "0") + "-" + parts[2].padStart(2, "0");
        } else {
          continue;
        }
      }
      map[dateStr] = starVal;
    }

    starDateMap = map;
    const count = Object.keys(map).length;
    statusEl.innerText = `星日期已加载（${count}条）`;
    statusEl.style.color = "#0e9f6e";
    return true;
  } catch (e) {
    console.error("星日期Excel加载失败：", e);
    statusEl.innerText = "星日期加载失败（不影响其他功能）";
    statusEl.style.color = "#d92121";
    return false;
  }
}

// ========== 简道云固定配置（无需修改） ==========
const JDY_CONFIG = {
  API_KEY: "QMX6XTmsa2s2h3nBy8kDIc1zmmBNSB1mb938E5999123010aDeEfEdDFC6804aCfE",
  APP_ID: "6738d31983d95dbc550e89e0",
  ENTRY_ID: "6a5592dfee45842efb1d91f6",
  dateField: "宴席日期",
  titleField: "预定情况"
};
// ========== 【唯一需要修改的地方】部署Vercel后替换域名 ==========
const PROXY_URL = "https://jdytbsj.vercel.app/api/proxy?url=";
const JDY_API_BASE = "https://api.jiandaoyun.com/api/v5/app";

let eventData = [];
// ========== 农历核心计算库（完整内置） ==========
const lunarInfo = [0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0aa50,0x1b252,0x06d20,0x0ada0];
const Gan = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const Zhi = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const lunarMonthText = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const lunarDayText = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
"十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
"廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
const solarTermName = ["小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"];
const sTermInfo = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
const holidayMap = {"1-1":"元旦","5-1":"劳动节","5-2":"劳动节","5-3":"劳动节","10-1":"国庆节","10-2":"国庆节","10-3":"国庆节","10-4":"国庆节","10-5":"国庆节","10-6":"国庆节","10-7":"国庆节","1-29":"春节","1-30":"春节","2-1":"春节","2-2":"春节","2-3":"春节","4-4":"清明节","6-10":"端午节","9-17":"中秋节"};

function getGanZhiYear(y){ return Gan[(y-4)%10]+Zhi[(y-4)%12]; }
function getLeapMonth(y){ return lunarInfo[y-1900] & 0xf; }
function getLeapDays(y){ const lm=getLeapMonth(y); return lm?((lunarInfo[y-1900]&0x10000)?30:29):0; }
function getLunarMonthDays(y,m){ return (lunarInfo[y-1900] & (0x10000>>m))?30:29; }
function getLunarYearDays(y){ let sum=348;for(let i=0x8000;i>0x8;i>>=1) sum+= (lunarInfo[y-1900]&i)?1:0; return sum+getLeapDays(y); }
function solarToLunar(y,m,d){
  const base=new Date(1900,0,31);
  const obj=new Date(y,m-1,d);
  let offset=Math.floor((obj-base)/86400000);
  let ly=1900;
  while(ly<2100&&offset>0){
    const yd=getLunarYearDays(ly);
    if(offset<=yd)break;offset-=yd;ly++;
  }
  let lm=1,isLeap=false;
  const leapM=getLeapMonth(ly);
  let md;
  while(lm<=12&&offset>0){
    if(leapM>0&&lm===leapM+1&&!isLeap){ lm--;isLeap=true;md=getLeapDays(ly); }
    else { md=getLunarMonthDays(ly,lm); }
    if(offset<=md)break; offset-=md; isLeap=false; lm++;
  }
  return {year:ly,month:lm,day:offset,isLeap};
}
function lunarToSolar(ly,lm,ld,isLeap){
  const base=new Date(1900,0,31);
  let offset=0;
  for(let y=1900;y<ly;y++) offset+=getLunarYearDays(y);
  const leapM=getLeapMonth(ly);
  for(let m=1;m<lm;m++){
    offset+=getLunarMonthDays(ly,m);
    if(leapM>0&&m===leapM) offset+=getLeapDays(ly);
  }
  if(isLeap&&leapM===lm) offset+=getLeapDays(ly);
  else if(leapM>0&&lm>leapM) offset+=getLeapDays(ly);
  offset+= (ld-1);
  const res=new Date(base.getTime()+offset*86400000);
  return {y:res.getFullYear(),m:res.getMonth()+1,d:res.getDate()};
}
function getSolarTerm(y,n){
  const base=new Date(1900,0,6,2,5,0);
  const ms=base.getTime()+y*31556925974.7+(sTermInfo[n]*60000);
  return new Date(ms);
}
function getYearAllSolarTerm(y){
  const arr=[];
  for(let i=0;i<24;i++){
    const dt=getSolarTerm(y,i);
    arr.push({name:solarTermName[i],y:dt.getFullYear(),m:dt.getMonth()+1,d:dt.getDate()})
  }
  return arr;
}
// ========== 拉取简道云宴席数据（已适配私有Vercel代理） ==========
async function fetchJdyEvents(){
  const url = `${JDY_API_BASE}/${JDY_CONFIG.APP_ID}/entry/${JDY_CONFIG.ENTRY_ID}/data/list`;
  try{
    const resp = await fetch(PROXY_URL + encodeURIComponent(url),{
      method:"POST",
      headers:{
        "Authorization":`Bearer ${JDY_CONFIG.API_KEY}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({limit:1000})
    });
    const json = await resp.json();
    if(json.code === 0 && json.data.list){
      eventData = json.data.list.map(item=>{
        const rawDate = item.data[JDY_CONFIG.dateField];
        return {
          date: rawDate ? rawDate.split(" ")[0] : "",
          title: item.data[JDY_CONFIG.titleField] || "无宴席"
        }
      }).filter(item=>item.date);
      renderCalendar();
      alert("宴席数据刷新成功！");
    }else{
      alert("数据拉取失败："+(json.msg||"接口返回异常"));
    }
  }catch(err){
    alert("网络请求异常："+err.message+"\n检查Vercel代理地址是否填写正确");
    console.error(err);
  }
}
// ========== 日历渲染UI逻辑 ==========
let currentYear,currentMonth;
let selectItem=null;
const $=s=>document.querySelector(s);
const calendarEl=$("#calendar");
const ymEl=$("#ym");
const infoCard=$("#infoCard");
const infoText=$("#infoText");
async function init(){
  const now=new Date();
  currentYear=now.getFullYear();
  currentMonth=now.getMonth()+1;
  renderCalendar();
  bindEvent();
  // 并行加载星日期和宴席数据
  loadStarExcel().then(()=>renderCalendar());
  fetchJdyEvents();
}
function renderCalendar(){
  calendarEl.innerHTML="";
  ymEl.innerText=`${currentYear}年${currentMonth}月`;
  const first=new Date(currentYear,currentMonth-1,1);
  const weekStart=first.getDay();
  const totalDay=new Date(currentYear,currentMonth,0).getDate();
  const today=new Date();
  const ty=today.getFullYear(),tm=today.getMonth()+1,td=today.getDate();
  const terms=getYearAllSolarTerm(currentYear);
  for(let i=0;i<weekStart;i++){
    const div=document.createElement("div");
    div.className="day-item empty";
    calendarEl.appendChild(div);
  }
  for(let d=1;d<=totalDay;d++){
    const div=document.createElement("div");
    const lunar=solarToLunar(currentYear,currentMonth,d);
    let lunarStr;
    if(lunar.isLeap) lunarStr="闰"+lunarMonthText[lunar.month-1]+lunarDayText[lunar.day-1];
    else if(lunar.day===1) lunarStr=lunarMonthText[lunar.month-1]+"月";
    else lunarStr=lunarDayText[lunar.day-1];
    const isToday=(ty===currentYear&&tm===currentMonth&&td===d);
    const isSelect=selectItem&&selectItem.y===currentYear&&selectItem.m===currentMonth&&selectItem.d===d;
    const dateStr=`${currentYear}-${String(currentMonth).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const match=eventData.find(x=>x.date===dateStr);
    const starType = starDateMap[dateStr] || "";

    div.className="day-item";
    if(isToday) div.classList.add("today");
    if(isSelect) div.classList.add("active");
    if(match) div.classList.add("has-ev");
    //添加星日期class
    if(starType==="星旺日") div.classList.add("star-wang");
    if(starType==="星吉日") div.classList.add("star-ji");
    if(starType==="星好日") div.classList.add("star-hao");
    if(starType==="星宜日") div.classList.add("star-yi");

    let festivalText="";
    const key=`${currentMonth}-${d}`;
    if(holidayMap[key]) festivalText=holidayMap[key];
    let termText="";
    const findTerm=terms.find(t=>t.m===currentMonth&&t.d===d);
    if(findTerm) termText=findTerm.name;
    let evHtml=match?`<div class="ev-tag">${match.title}</div>`:"";
    let starHtml=starType?`<div class="star-tag">${starType}</div>`:"";
    div.innerHTML=`
      <div class="solar">${d}</div>
      <div class="lunar">${lunarStr}</div>
      ${festivalText?`<div class="festival">${festivalText}</div>`:""}
      ${termText?`<div class="solar-term">${termText}</div>`:""}
      ${starHtml}${evHtml}
    `;
    div.dataset.y=currentYear;div.dataset.m=currentMonth;div.dataset.d=d;
    div.dataset.lunar=JSON.stringify(lunar);
    div.dataset.star=starType;
    div.onclick=()=>clickDay(div);
    calendarEl.appendChild(div);
  }
}
function clickDay(el){
  const y=Number(el.dataset.y);
  const m=Number(el.dataset.m);
  const d=Number(el.dataset.d);
  const lunar=JSON.parse(el.dataset.lunar);
  const starText = el.dataset.star || "无星日期";
  selectItem={y,m,d,lunar};
  const weekArr=["日","一","二","三","四","五","六"];
  const w=new Date(y,m-1,d).getDay();
  const gz=getGanZhiYear(lunar.year);
  let lunarDisplay=lunar.isLeap?`闰${lunarMonthText[lunar.month-1]}月${lunarDayText[lunar.day-1]}`:`${lunarMonthText[lunar.month-1]}月${lunarDayText[lunar.day-1]}`;
  infoCard.style.display="block";
  const dayStr=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const dayList = eventData.filter(x=>x.date===dayStr).map(i=>i.title).join("、")||"无宴席预定";
  infoText.innerHTML=`
    <div>公历：${y}-${m}-${d} 星期${weekArr[w]}</div>
    <div>农历：${gz}年 ${lunarDisplay}</div>
    <div>星日期：${starText}</div>
    <div>当日宴席：${dayList}</div>
  `;
  renderCalendar();
}
function bindEvent(){
  $("#prev").onclick=()=>{
    currentMonth--;if(currentMonth<1){ currentMonth=12; currentYear--; }
    selectItem=null; infoCard.style.display="none"; renderCalendar();
  }
  $("#next").onclick=()=>{
    currentMonth++;if(currentMonth>12){ currentMonth=1; currentYear=currentYear+1; }
    selectItem=null; infoCard.style.display="none"; renderCalendar();
  }
  $("#refresh").onclick=fetchJdyEvents;
  const themeBtn=$("#themeBtn");
  themeBtn.onclick=()=>{
    const html=document.documentElement;
    html.hasAttribute("data-theme")?(html.removeAttribute("data-theme"),themeBtn.innerText="切换深色"):(html.setAttribute("data-theme","dark"),themeBtn.innerText="切换浅色");
  }
  $("#doQuery").onclick=()=>{
    const type=$("#qType").value;
    const qy=Number($("#qY").value);
    const qm=Number($("#qM").value);
    const qd=Number($("#qD").value);
    const resEl=$("#queryResult");
    try{
      if(type=="s2l"){
        const l=solarToLunar(qy,qm,qd);
        const gz=getGanZhiYear(l.year);
        const lunarStr=l.isLeap?`闰${lunarMonthText[l.month-1]}月${lunarDayText[l.day-1]}`:`${lunarMonthText[l.month-1]}月${lunarDayText[l.day-1]}`;
        resEl.innerText=`公历 ${qy}-${qm}-${qd} → 农历 ${gz}年 ${lunarStr}`;
      }else{
        const s=lunarToSolar(qy,qm,qd,false);
        resEl.innerText=`农历 ${qy}年${qm}月${qd}日 → 公历 ${s.y}-${s.m}-${s.d}`;
      }
    }catch(e){resEl.innerText="输入日期无效";}
  }
}
init();
</script>
</body>
</html>
