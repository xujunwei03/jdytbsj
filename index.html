<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>宴席农历日历</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
:root{
  --bg:#ffffff;
  --text:#222;
  --card:#f7f7f7;
  --border:#ddd;
  --today-bg:#e8f4ff;
  --active-bg:#cce5ff;
  --has-ev:#fff2cc;
  --star-wang:#ffdddd;  /*星旺日 红色系*/
  --star-ji:#ffe8cc;    /*星吉日 橙色系*/
  --star-hao:#e9ddff;   /*星好日 紫色系*/
  --star-yi:#ddffdd;    /*星宜日 绿色系*/
}
html[data-theme="dark"]{
  --bg:#1a1a1a;
  --text:#eee;
  --card:#2a2a2a;
  --border:#444;
  --today-bg:#203040;
  --active-bg:#254060;
  --has-ev:#443820;
  --star-wang:#4b2222;  /*星旺日 深色模式红色*/
  --star-ji:#4b3822;    /*星吉日 深色模式橙色*/
  --star-hao:#382b4b;   /*星好日 深色模式紫色*/
  --star-yi:#224022;    /*星宜日 深色模式绿色*/
}
body{background:var(--bg);color:var(--text);padding:8px;max-width:1200px;margin:0 auto;}

/* 头部控制栏布局 */
.header-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:8px;
}
#ym{font-size:22px;font-weight:bold;text-align:center;}
.icon-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:6px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  user-select:none;
}
.ctrl-bar{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap;}
button{padding:5px 10px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:4px;cursor:pointer;font-size:14px;}

#calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;touch-action:pan-y;}
/*星期头部*/
.week-header{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  margin-bottom:4px;
}
.week-header>div{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  background:var(--card);
  border-radius:4px;
  border:1px solid var(--border);
}

.day-item{position:relative;border:1px solid var(--border);min-height:82px;padding:3px;border-radius:4px;background:var(--card);overflow:hidden;}
.day-item.empty{background:transparent;border:none;}
.day-item.today{background:var(--today-bg);}
.day-item.active{background:var(--active-bg);}
.day-item.has-ev{background:var(--has-ev);}
.day-item.star-wang{background:var(--star-wang);}
.day-item.star-ji{background:var(--star-ji);}
.day-item.star-hao{background:var(--star-hao);}
.day-item.star-yi{background:var(--star-yi);}

.solar{font-size:16px;font-weight:bold;position:relative;line-height:1.1;}
/* 今日星星放在左下角 */
.today-mark{
  position:absolute;
  left:2px;
  bottom:2px;
  color:#ff3333;
  font-size:14px;
}
.lunar{font-size:10px;opacity:0.85;line-height:1.1;}
.festival,.lunar-festival,.solar-term{font-size:11px;color:#d03030;line-height:1.1;}
.star-tag{font-size:11px;color:#0066aa;font-weight:bold;line-height:1.1;}
.ev-badge{position:absolute;top:1px;right:1px;background:#d92121;color:#fff;border-radius:99px;font-size:10px;padding:0 3px;min-width:14px;text-align:center;line-height:1.2;}

#infoCard{margin-top:12px;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);display:none;}
.detail-item{border-top:1px solid var(--border);padding:6px 0;font-size:13px;line-height:1.5;}
.status-line{margin:4px 0;font-size:12px;line-height:1.3;}

/*手机小屏幕进一步压缩*/
@media (max-width:480px){
  body{padding:4px;}
  #ym{font-size:18px;margin-bottom:0;}
  .icon-btn{width:30px;height:30px;font-size:16px;}
  .ctrl-bar button{padding:4px 7px;font-size:13px;}
  #calendar{gap:2px;}
  .week-header{gap:2px;margin-bottom:3px;}
  .week-header>div{font-size:11px;padding:3px 0;}
  .day-item{min-height:66px;padding:2px;}
  .solar{font-size:14px;}
  .lunar{font-size:9px;}
  .festival,.lunar-festival,.solar-term,.star-tag{font-size:9px;}
  .ev-badge{font-size:9px;min-width:12px;}
  .status-line{font-size:11px;}
}
</style>
</head>
<body>

<div class="header-wrap">
  <div class="icon-btn" id="prev">◀</div>
  <div id="ym"></div>
  <div class="icon-btn" id="next">▶</div>
</div>
<div class="ctrl-bar">
  <button id="refresh">刷新数据</button>
  <button id="themeBtn">切换深色</button>
</div>

<div class="status-line" id="lunarLoadStatus"></div>
<div class="status-line" id="starStatus"></div>
<div class="status-line" id="loadStatus"></div>
<div class="status-line" id="cacheInfo"></div>

<!--星期头部栏-->
<div class="week-header">
  <div>日</div>
  <div>一</div>
  <div>二</div>
  <div>三</div>
  <div>四</div>
  <div>五</div>
  <div>六</div>
</div>

<div id="calendar"></div>

<div id="infoCard">
  <div id="infoText"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ============================================================
// 配置区
// ============================================================
const STAR_EXCEL_CONFIG = {
  url: "./star.xlsx",
  sheetName: "",
  dateColumn: 0,       // 公历日期列（A列=0）
  starColumn: 1,       // 星日期类型列（B列=1）
  lunarColumn: 2,      // 农历日列（C列=2），根据实际列号修改
  skipHeader: true
};
const FESHU_JSON_URL = "./feishu_data.json";
const LOCAL_STORAGE_KEY = "feishu_banquet_cache";
const CACHE_TTL = 5 * 60 * 1000;

let starDateMap = {};    // key:公历日期 -> value:星类型
let starLunarMap = {};   // key:公历日期 -> value:农历显示文本（来自star.xlsx）
let fullEventList = [];
let loading = false;

// ========== 农历中文映射（备用，若star.xlsx农历列是数字则用此转换）==========
const lunarMonthCn = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const lunarDayCn = [
    "","初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
    "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
    "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"
];

/**
 * 格式化农历显示：
 * - 如果star.xlsx农历列已经是"七月初二"这种文本，直接返回
 * - 如果是数字或对象，做兼容处理
 */
function formatLunarDisplay(rawVal){
  if(rawVal === null || rawVal === undefined || rawVal === "") return "--";
  // 已经是字符串，直接展示
  if(typeof rawVal === "string") return rawVal.trim();
  // 对象格式 {lunarMonthStr,lunarDayStr,isLeap} 兼容
  if(typeof rawVal === "object"){
    const leapTxt = rawVal.isLeap ? "闰" : "";
    return `${leapTxt}${rawVal.lunarMonthStr || ""}${rawVal.lunarDayStr || ""}`;
  }
  return String(rawVal);
}

// ========== 节日配置 ==========
const SOLAR_FESTIVAL = {
  "1-1": "元旦",
  "2-14": "情人节",
  "3-8": "妇女节",
  "4-4": "清明节",
  "4-5": "清明节",
  "5-1": "劳动节",
  "6-1": "儿童节",
  "10-1": "国庆节"
};

// 农历节日关键词映射，匹配star.xlsx输出的农历文本
const LUNAR_FESTIVAL_MAP = [
  {key:"正月初一",name:"春节"},
  {key:"正月十五",name:"元宵节"},
  {key:"五月初五",name:"端午节"},
  {key:"七月初七",name:"七夕"},
  {key:"八月十五",name:"中秋节"},
  {key:"九月初九",name:"重阳节"},
  {key:"腊月初八",name:"腊八"},
  {key:"腊月三十",name:"除夕"},
  {key:"腊月廿九",name:"除夕"}
];

const SOLAR_TERM = {
  "2024-09-07": "白露",
  "2024-09-23": "秋分",
  "2024-10-08": "寒露",
  "2024-10-23": "霜降",
  "2024-11-07": "立冬",
  "2024-11-22": "小雪",
  "2024-12-07": "大雪",
  "2024-12-21": "冬至",
  "2025-01-05": "小寒",
  "2025-01-20": "大寒",
  "2025-02-03": "立春",
  "2025-02-18": "雨水",
  "2025-03-05": "惊蛰",
  "2025-03-20": "春分",
  "2025-04-04": "清明",
  "2025-04-20": "谷雨",
  "2025-05-05": "立夏",
  "2025-05-21": "小满",
  "2025-06-05": "芒种",
  "2025-06-21": "夏至",
  "2025-07-07": "小暑",
  "2025-07-22": "大暑",
  "2025-08-07": "立秋",
  "2025-08-23": "处暑",
  "2025-09-07": "白露",
  "2025-09-23": "秋分",
  "2025-10-08": "寒露",
  "2025-10-23": "霜降",
  "2025-11-07": "立冬",
  "2025-11-22": "小雪",
  "2025-12-07": "大雪",
  "2025-12-21": "冬至",
  "2026-01-05": "小寒",
  "2026-01-20": "大寒",
  "2026-02-04": "立春",
  "2026-02-18": "雨水",
  "2026-03-05": "惊蛰",
  "2026-03-20": "春分",
  "2026-04-05": "清明",
  "2026-04-20": "谷雨",
  "2026-05-05": "立夏",
  "2026-05-21": "小满",
  "2026-06-05": "芒种",
  "2026-06-21": "夏至",
  "2026-07-07": "小暑",
  "2026-07-23": "大暑",
  "2026-08-08": "立秋",
  "2026-08-23": "处暑",
  "2026-09-08": "白露",
  "2026-09-23": "秋分",
  "2026-10-08": "寒露",
  "2026-10-23": "霜降",
  "2026-11-07": "立冬",
  "2026-11-22": "小雪",
  "2026-12-07": "大雪",
  "2026-12-21": "冬至"
};

// ========== 本地缓存工具 ==========
function saveEventCache(list){
  try{
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
      updateTime: Date.now(),
      data: list
    }));
  }catch(e){
    console.warn("浏览器阻止localStorage写入",e);
  }
}

function readEventCache(){
  try{
    const str = localStorage.getItem(LOCAL_STORAGE_KEY);
    if(!str) return null;
    return JSON.parse(str);
  }catch(e){
    console.warn("浏览器阻止localStorage读取",e);
    return null;
  }
}

function isCacheExpired(cacheObj){
  return Date.now() - cacheObj.updateTime > CACHE_TTL;
}

function getMonthEventFromCache(y,m){
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const end = `${y}-${String(m).padStart(2,"0")}-${new Date(y,m,0).getDate()}`;
  return fullEventList.filter(item => item.date >= start && item.date <= end);
}

// ========== 星日期Excel（同时读取农历列）==========
async function loadStarExcel() {
  const statusEl = document.getElementById("starStatus");
  const lunarStatusEl = document.getElementById("lunarLoadStatus");
  try {
    const resp = await fetch(STAR_EXCEL_CONFIG.url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheetName = STAR_EXCEL_CONFIG.sheetName || wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    if (!sheet) throw new Error("找不到工作表：" + sheetName);
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
    const starMap = {};
    const lunarMap = {};
    const startIdx = STAR_EXCEL_CONFIG.skipHeader ? 1 : 0;
    for (let i = startIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.length === 0) continue;
      let dateVal = row[STAR_EXCEL_CONFIG.dateColumn];
      const starVal = (row[STAR_EXCEL_CONFIG.starColumn] || "").toString().trim();
      const lunarVal = row[STAR_EXCEL_CONFIG.lunarColumn];
      if (!dateVal) continue;
      let dateStr;
      if (dateVal instanceof Date) {
        dateStr = dateVal.getFullYear() + "-" + String(dateVal.getMonth() + 1).padStart(2, "0") + "-" + String(dateVal.getDate()).padStart(2, "0");
      } else {
        dateVal = dateVal.toString().trim();
        const parts = dateVal.split(/[\/\-]/);
        if (parts.length === 3) {
          dateStr = parts[0] + "-" + String(parts[1]).padStart(2, "0") + "-" + String(parts[2]).padStart(2, "0");
        } else {
          continue;
        }
      }
      if (starVal) starMap[dateStr] = starVal;
      if (lunarVal !== undefined && lunarVal !== null && lunarVal !== "") {
        lunarMap[dateStr] = lunarVal;
      }
    }
    starDateMap = starMap;
    starLunarMap = lunarMap;

    if(statusEl){
      statusEl.innerText = `星日期已加载（${Object.keys(starMap).length}条）`;
      statusEl.style.color = "#0e9f6e";
    }
    if(lunarStatusEl){
      lunarStatusEl.innerText = `✅农历数据已从star.xlsx载入，共${Object.keys(lunarMap).length}条`;
      lunarStatusEl.style.color = "#0e9f6e";
    }
    return true;
  } catch (e) {
    console.error("星日期Excel加载失败：", e);
    if(statusEl){
      statusEl.innerText = "星日期加载失败（不影响其他功能）";
      statusEl.style.color = "#d92121";
    }
    if(lunarStatusEl){
      lunarStatusEl.innerText = "❌农历加载失败，请确认star.xlsx农历列配置";
      lunarStatusEl.style.color = "#d92121";
    }
    return false;
  }
}

// ========== 宴席数据 ==========
async function loadFeishuJson(forceRefresh = false){
  if(loading) return;
  loading = true;
  const loadStatus = document.getElementById("loadStatus");
  const cacheInfo = document.getElementById("cacheInfo");
  try{
    if(forceRefresh){
      if(loadStatus) loadStatus.innerText = "正在读取feishu_data.json宴席数据...";
    }
    const resp = await fetch(FESHU_JSON_URL, { cache: forceRefresh ? "no-cache" : "default" });
    if(!resp.ok) throw new Error(`文件读取失败 ${resp.status}，确认feishu_data.json和index.html放在同一目录`);
    const rawArr = await resp.json();
    const formatList = rawArr.map(item => {
      return {
        date: item["宴会日期"] || "",
        hall: item["宴会厅"] || "",
        customer: item["客户|宴会主题"] || "",
        table: item["桌数"] || "",
        sales: item["销售负责人"] || "",
        title: item["预定情况"] || ""
      }
    }).filter(item => !!item.date);

    fullEventList = formatList;
    saveEventCache(fullEventList);
    const time = new Date().toLocaleString();
    if(cacheInfo){
      cacheInfo.innerText = `缓存更新:${time}`;
      cacheInfo.style.color = "#0e9f6e";
    }
    renderCalendar();
    if(loadStatus) loadStatus.innerText = `✅已同步全部宴席${fullEventList.length}条`;
  }catch(err){
    if(!forceRefresh){
      if(loadStatus) loadStatus.innerText = "网络更新失败，继续使用本地缓存";
    }else{
      alert("读取feishu_data.json失败：" + err.message);
      if(loadStatus) loadStatus.innerText = "❌读取json失败";
    }
    console.error(err);
  }finally{
    loading = false;
  }
}

// ========== 节日读取 ==========
function getSolarFestival(y,m,d){
  const k = `${m}-${d}`;
  return SOLAR_FESTIVAL[k] || "";
}

function getLunarFestival(lunarText){
  if(!lunarText) return "";
  const found = LUNAR_FESTIVAL_MAP.find(f => lunarText.includes(f.key));
  return found ? found.name : "";
}

function getSolarTerm(y,m,d){
  const dateStr = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  return SOLAR_TERM[dateStr] || "";
}

// ========== 日历渲染 ==========
let currentYear, currentMonth;
let selectItem = null;
const $ = s => document.querySelector(s);
const calendarEl = $("#calendar");
const ymEl = $("#ym");
const infoCard = $("#infoCard");
const infoText = $("#infoText");

// 滑动手势变量
let touchStartX = 0;
let touchEndX = 0;

async function init(){
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth() + 1;

  const cache = readEventCache();
  if(cache && Array.isArray(cache.data)){
    fullEventList = cache.data;
    const timeStr = new Date(cache.updateTime).toLocaleString();
    const cacheInfoEl = document.getElementById("cacheInfo");
    if(cacheInfoEl){
      cacheInfoEl.innerText = `本地缓存:${timeStr}`;
      cacheInfoEl.style.color = "#0e9f6e";
    }
  }

  bindEvent();

  // 只加载star.xlsx（含农历）和宴席数据
  const pExcel = loadStarExcel();
  if(cache === null || isCacheExpired(cache)){
    loadFeishuJson(false);
  }
  await pExcel;

  renderCalendar();
}

function renderCalendar(){
  const eventData = getMonthEventFromCache(currentYear, currentMonth);

  calendarEl.innerHTML = "";
  ymEl.innerText = `${currentYear}年${currentMonth}月`;
  const first = new Date(currentYear, currentMonth - 1, 1);
  const weekStart = first.getDay();
  const totalDay = new Date(currentYear, currentMonth, 0).getDate();
  const today = new Date();
  const ty = today.getFullYear(), tm = today.getMonth() + 1, td = today.getDate();

  const groupMap = {};
  for(const ev of eventData){
    if(!ev.date) continue;
    if(!groupMap[ev.date]) groupMap[ev.date] = [];
    groupMap[ev.date].push(ev);
  }

  for(let i = 0; i < weekStart; i++){
    const div = document.createElement("div");
    div.className = "day-item empty";
    calendarEl.appendChild(div);
  }

  for(let d = 1; d <= totalDay; d++){
    const div = document.createElement("div");
    const dateStr = `${currentYear}-${String(currentMonth).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    // 农历从star.xlsx的starLunarMap取
    const lunarRaw = starLunarMap[dateStr];
    const lunarShowText = formatLunarDisplay(lunarRaw);

    const isToday = (ty === currentYear && tm === currentMonth && td === d);
    const isSelect = selectItem && selectItem.y === currentYear && selectItem.m === currentMonth && selectItem.d === d;
    const dayEvList = groupMap[dateStr] || [];
    const dayCount = dayEvList.length;
    const starType = starDateMap[dateStr] || "";

    div.className = "day-item";
    if(isToday) div.classList.add("today");
    if(isSelect) div.classList.add("active");
    if(dayCount > 0) div.classList.add("has-ev");
    if(starType === "星旺日") div.classList.add("star-wang");
    if(starType === "星吉日") div.classList.add("star-ji");
    if(starType === "星好日") div.classList.add("star-hao");
    if(starType === "星宜日") div.classList.add("star-yi");

    const festivalText = getSolarFestival(currentYear, currentMonth, d);
    const lunarFestivalText = getLunarFestival(lunarShowText);
    const termText = getSolarTerm(currentYear, currentMonth, d);

    const badgeHtml = dayCount > 0 ? `<div class="ev-badge">${dayCount}</div>` : "";
    const starHtml = starType ? `<div class="star-tag">${starType}</div>` : "";
    const todayStarMark = isToday ? `<span class="today-mark">⭐</span>` : "";

    div.innerHTML = `
      ${badgeHtml}
      <div class="solar">${d}</div>
      <div class="lunar">${lunarShowText}</div>
      ${festivalText ? `<div class="festival">${festivalText}</div>` : ""}
      ${lunarFestivalText ? `<div class="lunar-festival">${lunarFestivalText}</div>` : ""}
      ${termText ? `<div class="solar-term">${termText}</div>` : ""}
      ${starHtml}
      ${todayStarMark}
    `;

    div.dataset.y = currentYear;
    div.dataset.m = currentMonth;
    div.dataset.d = d;
    div.dataset.lunar = lunarShowText;
    div.dataset.star = starType;
    div.dataset.dateStr = dateStr;
    div.onclick = () => clickDay(div, dayEvList);
    calendarEl.appendChild(div);
  }
}

function clickDay(el, evList){
  const y = Number(el.dataset.y);
  const m = Number(el.dataset.m);
  const d = Number(el.dataset.d);
  const lunarText = el.dataset.lunar || "--";
  const starText = el.dataset.star || "无星日期";
  const dateStr = el.dataset.dateStr;

  selectItem = { y, m, d, lunar: lunarText };
  const weekArr = ["日","一","二","三","四","五","六"];
  const w = new Date(y, m - 1, d).getDay();

  infoCard.style.display = "block";

  let detailHtml = "";
  if(evList.length === 0){
    detailHtml = "<div>当日暂无宴席预定</div>";
  }else{
    evList.forEach(ev => {
      detailHtml += `
      <div class="detail-item">
        <div>🏨宴会厅：${ev.hall || "未填写"}</div>
        <div>👤客户|宴会主题：${ev.customer || "未填写"}</div>
        <div>🪑桌数：${ev.table || "未填写"}</div>
        <div>👔销售负责人：${ev.sales || ""}</div>
        <div>📋预定情况：${ev.title || ""}</div>
      </div>
      `;
    });
  }

  infoText.innerHTML = `
    <div>公历：${y}-${m}-${d} 星期${weekArr[w]}</div>
    <div>农历：${lunarText}</div>
    <div>星日期：${starText}</div>
    <div style="margin:8px 0 4px 0;font-weight:bold">宴席详情（共${evList.length}场）</div>
    ${detailHtml}
  `;
  renderCalendar();
}

// 切换月份逻辑
function goPrevMonth(){
  if(loading) return;
  currentMonth--;
  if(currentMonth < 1){ currentMonth = 12; currentYear--; }
  selectItem = null;
  infoCard.style.display = "none";
  renderCalendar();
}
function goNextMonth(){
  if(loading) return;
  currentMonth++;
  if(currentMonth > 12){ currentMonth = 1; currentYear++; }
  selectItem = null;
  infoCard.style.display = "none";
  renderCalendar();
}

function bindEvent(){
  $("#prev").onclick = goPrevMonth;
  $("#next").onclick = goNextMonth;

  $("#refresh").onclick = async () => {
    await loadFeishuJson(true);
  };

  const themeBtn = $("#themeBtn");
  themeBtn.onclick = () => {
    const html = document.documentElement;
    html.hasAttribute("data-theme") ? (html.removeAttribute("data-theme"), themeBtn.innerText = "切换深色") : (html.setAttribute("data-theme", "dark"), themeBtn.innerText = "切换浅色");
  };

  // 手机左右滑动
  calendarEl.addEventListener('touchstart', (e)=>{
    touchStartX = e.changedTouches[0].screenX;
  },{passive:true});
  calendarEl.addEventListener('touchend', (e)=>{
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    // 滑动阈值大于50px才触发
    if(Math.abs(diff) > 50){
      if(diff < 0){
        // 向左滑 -> 下月
        goNextMonth();
      }else{
        // 向右滑 -> 上月
        goPrevMonth();
      }
    }
  },{passive:true});
}

init();
</script>
